name: Build Capacitor iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd $GITHUB_WORKSPACE
          npm install

      - name: Build Web Project
        run: |
          cd $GITHUB_WORKSPACE
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd $GITHUB_WORKSPACE
          npx cap sync ios

      - name: Build iOS App Xcode
        run: |
          cd $GITHUB_WORKSPACE/ios/App
          xcodebuild -workspace *.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Unsigned IPA
        run: |
          cd $GITHUB_WORKSPACE/ios/App/build
          mkdir -p Payload
          mv Build/Products/Release-iphoneos/*.app Payload/
          zip -r ProductManager-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-ios-ipa
          path: ${{ github.workspace }}/ios/App/build/ProductManager-Unsigned.ipa
