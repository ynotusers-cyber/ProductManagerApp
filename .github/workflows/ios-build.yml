name: Build Capacitor iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App Xcode
        run: |
          cd ios/App
          xcodebuild -workspace *.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Unsigned IPA
        run: |
          mkdir -p ios/App/build/Payload
          mv ios/App/build/Build/Products/Release-iphoneos/*.app ios/App/build/Payload/
          cd ios/App/build
          zip -r ProductManager-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-ios-ipa
          path: ios/App/build/ProductManager-Unsigned.ipa
